    stroke-linejoin: round;
    stroke-dasharray: 6800;
    stroke-dashoffset: 6800;
    animation: draw 2.2s ease-in-out infinite;

  .logo-fill {
    fill: #E24B4A;
    opacity: 0;
    animation: fadeIn 2.2s ease-in-out infinite;
  }
  @keyframes draw {
    0%   { stroke-dashoffset: 6800; opacity: 1; }
    55%  { stroke-dashoffset: 0; opacity: 1; }
    75%  { opacity: 0; }
    100% { opacity: 0; stroke-dashoffset: 6800; }
  }
  @keyframes fadeIn {
    0%, 55% { opacity: 0; }
    80%     { opacity: 1; }
    100%    { opacity: 1; }
